<div class="login-page">
  <!-- PANEL IZQUIERDO -->
  <section class="login-hero">
    <div class="login-hero__bg"></div>
    <div class="login-hero__overlay"></div>

    <div class="login-hero__content">
      <div></div>

      <div class="login-hero__text">
        <h1>
          Bienvenido
          <span>de vuelta</span>
        </h1>

        <p>
          Inicia sesión para continuar gestionando tu empresa de manera eficiente.
        </p>
      </div>

      <div class="login-hero__footer">
        <div class="login-hero__icon">
          <i class="pi pi-shield"></i>
        </div>

        <div>
          <p class="footer-title">Sistema de Gestión Empresarial</p>
          <p class="footer-subtitle">Tu empresa, en orden.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- PANEL DERECHO -->
  <section class="login-panel">
    <div class="login-card">
      <div class="login-header">
        <h2>Iniciar sesión</h2>
        <p>Ingresa tus credenciales para acceder</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Correo -->
        <div class="field-group">
          <label for="email"><i class="pi pi-envelope"> </i> Correo electrónico</label>
          <span class="p-input-icon-left login-input-wrapper">
            <input
              id="email"
              type="email"
              pInputText
              formControlName="email"
              placeholder="ejemplo@empresa.com"
              class="login-input"
            />
          </span>
        </div>

        <!-- Contraseña -->
        <div class="field-group">
          <label for="password">Contraseña</label>
          <p-password
            inputId="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            [inputStyleClass]="'login-input'"
            styleClass="login-password"
            placeholder="Tu contraseña"
          ></p-password>
        </div>

        <!-- opciones -->
        <div class="login-options">
          <div class="remember-me">
            <p-checkbox
              formControlName="remember"
              binary="true"
              inputId="remember"
            ></p-checkbox>
            <label for="remember">Recordarme</label>
          </div>

          <a href="javascript:void(0)">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- botón principal -->
        <button pButton type="submit" class="login-submit">
          Iniciar sesión
        </button>

        <!-- separador -->
        <div class="divider">
          <span></span>
          <p>o continúa con</p>
          <span></span>
        </div>

        <!-- google -->
        <button
          pButton
          type="button"
          class="social-btn"
          (click)="loginWithGoogle()"
        >
          <img src="/icons/google.svg" alt="Google" />
          <span>Continuar con Google</span>
        </button>

        <!-- microsoft -->
        <button
          pButton
          type="button"
          class="social-btn"
          (click)="loginWithMicrosoft()"
        >
          <img src="/icons/microsft.svg" alt="Microsoft" />
          <span>Continuar con Microsoft</span>
        </button>

        <p class="login-contact">
          ¿No tienes una cuenta?
          <a href="javascript:void(0)">Contacta al administrador</a>
        </p>
      </form>
    </div>
  </section>
</div>
