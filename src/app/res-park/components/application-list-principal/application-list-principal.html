
@for(item of principalToolsList(); track item){
  <li>
  <a pRipple
    [routerLink]="item.route"
    class="flex align-items-center gap-2 no-underline cursor-pointer p-4 border-round hover:bg-gray-300 text-gray-700 dark:text-surface-100  dark:hover:bg-surface-700 duration-180 transition-colors p-ripple">
    <i [class]="item.icon"></i>
    <span>{{item.name}}</span>
  </a>
</li>
}
