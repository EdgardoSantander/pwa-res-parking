          <div class="card flex justify-center">
            <p-drawer #drawerRef [(visible)]="visible">
              <ng-template #headless>
                <div class="flex justify-content-end pt-3 pr-3">
                  <span>
                  <p-button  type="button" (click)="closeCallback()" icon="pi pi-times-circle "
                    severity="info" rounded="true" styleClass="btn-close-large" outlined="true"></p-button>
                </span>
                </div>
                <div class="full flex flex-col h-screen">
                  <div class="flex items-center justify-between px-5 shrink-0">
                    <span class="inline-flex items-center gap-2">
                      <img src="icons/icon-re-pa.png" alt="Residential Parking" class="block mx-auto w-3 h-4" />
                      <span class="font-semibold text-2xl color-general-components">Residential Parking</span>
                    </span>

                  </div>

                  <div class="flex-1 overflow-y-auto min-h-0">
                    <ul class="list-none p-4 m-0">
                      <li>
                        <div pRipple pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-slidedown"
                          leaveToClass="hidden" leaveActiveClass="animate-slideup"
                          class="p-4 flex items-center justify-between text-surface-600 dark:text-surface-200 cursor-pointer p-ripple">
                          <span class="  font-bold">FAVORITES</span>
                          <i class="pi pi-chevron-down"></i>
                        </div>
                        <ul class="list-none p-0 m-0 overflow-hidden hidden font-bold">
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-home mr-2"></i>
                              <span>Dashboard</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-bookmark mr-2"></i>
                              <span>Bookmarks</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-slidedown"
                              leaveToClass="hidden" leaveActiveClass="animate-slideup"
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-chart-line mr-2"></i>
                              <span class=" ">Reports</span>
                              <i class="pi pi-chevron-down ml-auto"></i>
                            </a>
                            <ul class="list-none py-0 pl-4 pr-0 m-0 hidden overflow-y-hidden transition-all  ease-in-out">
                              <li>
                                <a pRipple pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-slidedown"
                                  leaveToClass="hidden" leaveActiveClass="animate-slideup"
                                  class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                  <i class="pi pi-chart-line mr-2"></i>
                                  <span class=" ">Revenue</span>
                                  <i class="pi pi-chevron-down ml-auto"></i>
                                </a>
                                <ul
                                  class="list-none py-0 pl-4 pr-0 m-0 hidden overflow-y-hidden transition-all  ease-in-out">
                                  <li>
                                    <a pRipple
                                      class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                      <i class="pi pi-table mr-2"></i>
                                      <span class=" ">View</span>
                                    </a>
                                  </li>
                                  <li>
                                    <a pRipple
                                      class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                      <i class="pi pi-search mr-2"></i>
                                      <span class=" ">Search</span>
                                    </a>
                                  </li>
                                </ul>
                              </li>
                              <li>
                                <a pRipple
                                  class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                  <i class="pi pi-chart-line mr-2"></i>
                                  <span class=" ">Expenses</span>
                                </a>
                              </li>
                            </ul>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-users mr-2"></i>
                              <span class=" ">Team</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-comments mr-2"></i>
                              <span class=" ">Messages</span>
                              <span
                                class="inline-flex items-center justify-center ml-auto bg-primary text-primary-contrast rounded-full"
                                style="min-width: 1.5rem; height: 1.5rem">3</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-calendar mr-2"></i>
                              <span class=" ">Calendar</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-cog mr-2"></i>
                              <span class=" ">Settings</span>
                            </a>
                          </li>
                        </ul>
                      </li>
                    </ul>
                    <ul class="list-none p-4 m-0 font-bold">
                      <li>
                        <div pRipple pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-slidedown"
                          leaveToClass="hidden" leaveActiveClass="animate-slideup"
                          class="p-4 flex items-center justify-between text-surface-600 dark:text-surface-200 cursor-pointer p-ripple">
                          <span class=" ">APPLICATION</span>
                          <i class="pi pi-chevron-down"></i>
                        </div>
                        <ul class="list-none p-0 m-0 overflow-hidden">
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-folder mr-2"></i>
                              <span class=" ">Projects</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-chart-bar mr-2"></i>
                              <span class=" ">Performance</span>
                            </a>
                          </li>
                          <li>
                            <a pRipple
                              class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                              <i class="pi pi-cog mr-2"></i>
                              <span class=" ">Settings</span>
                            </a>
                          </li>
                        </ul>
                      </li>
                    </ul>
                  </div>
                  <div class="shrink-0 mt-auto">
                    <hr class="mb-3 mx-4 border-t  border-color-general-components" />
                    <a pRipple
                      class="m-2 flex cursor-pointer  rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                      <p-avatar class="ml-4 mb-1 mr-2" image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" />
                      <span class="font-bold mt-2">Amy Elsner</span>
                    </a>
                    <div class="flex justify-content-end pr-3 pb-3">
                      <a class="mt-2 mr-2  font-bold">Salir</a>
                      <p-button type="button" severity="info" icon="pi pi-sign-out"></p-button>
                    </div>
                  </div>
                </div>
              </ng-template>
            </p-drawer>
            <p-button (click)="visible = true" icon="pi pi-bars" severity="info"/>
          </div>
